<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"
     role="img" aria-label="VRAM Planner">
  <title>VRAM Planner</title>
  <!--
    The mark is the answer the planner gives: the largest that fits.

    Three columns rising toward a limit, in the roles the app colours everywhere
    else - weights, KV cache, compute buffer - and one hard rule across the top:
    the VRAM budget. The tallest column stops exactly at it and does not cross.
    That is the whole product in one glyph.

    No plate and no gradient, deliberately. A rounded dark tile with a teal
    gradient is what every generated logo looks like, and the mark also has to
    survive a README that renders on white AND on near-black. So it is built
    only from things that read on both: saturated columns, and a cap in a mid
    neutral that clears 4:1 against white and against #0d1117 alike. Neutral and
    not a hue, because in this project colour names a memory term - the limit is
    structure, and structure is never coloured.
  -->

  <!-- weights - exact, and the floor everything else is measured against -->
  <rect x="16" y="84" width="28" height="32" fill="#3d8fe0"/>
  <!-- KV cache - grows with the context you ask for -->
  <rect x="50" y="58" width="28" height="58" fill="#17a583"/>
  <!-- compute buffer - the one estimated term, so it is the one that reaches
       the limit and decides where the split lands -->
  <rect x="84" y="31" width="28" height="85" fill="#8560e8"/>

  <!-- the budget. Wider than the columns, so it reads as a limit over them
       rather than as a lid on them. -->
  <rect x="10" y="16" width="108" height="10" fill="#6e747d"/>
</svg>
